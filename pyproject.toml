[project]
name = "nbawp"
version = "0.1.0"
description = "In-game NBA win probability model and Golden State Warriors 2024-25 analysis"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
